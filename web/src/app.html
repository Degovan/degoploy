<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<!-- Sets the dark class before the first paint; see static/theme.js. -->
		<script src="/theme.js"></script>
		<style>
			/* Loading screen until the first page is ready; the root layout fades it out.
			   It shows only after a moment, so a fast load goes straight to the page. */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
				background: var(--background);
				color: var(--muted-foreground);
				font:
					13px/1.4 system-ui,
					sans-serif;
				animation: splash-in 200ms ease-out 150ms both;
			}
			#splash .mark {
				display: flex;
				width: 40px;
				height: 40px;
				align-items: center;
				justify-content: center;
				border-radius: 10px;
				background: var(--primary);
				color: var(--primary-foreground);
			}
			#splash .mark svg {
				width: 60%;
				height: 60%;
			}
			#splash .bar {
				position: relative;
				width: 96px;
				height: 2px;
				overflow: hidden;
				border-radius: 2px;
				background: var(--border);
			}
			#splash .bar::after {
				content: '';
				position: absolute;
				inset: 0 auto 0 0;
				width: 40%;
				border-radius: 2px;
				background: var(--muted-foreground);
				animation: splash-bar 1.1s ease-in-out infinite;
			}
			@keyframes splash-in {
				from {
					opacity: 0;
				}
			}
			@keyframes splash-bar {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash,
				#splash .bar::after {
					animation: none;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" role="status" aria-label="Loading degoploy">
			<div class="mark">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
					<path d="M12 3v12" stroke-linecap="round" />
					<path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
					<path d="M5 20h14" stroke-linecap="round" />
				</svg>
			</div>
			<div class="bar"></div>
			<noscript>degoploy needs JavaScript.</noscript>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
